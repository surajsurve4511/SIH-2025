<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Farm Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-green': '#4CAF50', // Main green for positive actions, nature
            'brand-brown': '#795548', // Earthy tones, secondary elements
            'brand-blue': '#2196F3',  // For primary actions, information
            'brand-yellow': '#FFC107', // For warnings, notes
            'brand-orange': '#FF9800', // For alerts, attention
            'brand-purple': '#9C27B0', // For AI features, distinct elements
            'brand-teal': '#009688',   // Accent color

            // Greys for text, backgrounds, borders
            'neutral-base': '#F8FAFC', // Lightest page background
            'neutral-100': '#F1F5F9', // Light backgrounds for cards, sections
            'neutral-200': '#E2E8F0', // Borders
            'neutral-300': '#CBD5E1', // Lighter text, icons
            'neutral-400': '#94A3B8', // Medium text, icons
            'neutral-500': '#64748B', // Standard text
            'neutral-600': '#475569', // Semi-bold text
            'neutral-700': '#334155', // Headings, important text
            'neutral-800': '#1E293B', // Darker elements
            'neutral-900': '#0F172A', // Darkest text/elements
          },
          keyframes: {
            fadeIn: {
              'from': { opacity: '0' },
              'to': { opacity: '1' },
            },
            modalShow: {
              'from': { opacity: '0', transform: 'scale(0.95)' },
              'to': { opacity: '1', transform: 'scale(1)' },
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.2s ease-out forwards',
            modalShow: 'modalShow 0.2s ease-out forwards',
          }
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.4.0",
    "browser-image-compression": "https://esm.sh/browser-image-compression@2.0.2"
  }
}
</script>
</head>
<body class="bg-neutral-base">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
